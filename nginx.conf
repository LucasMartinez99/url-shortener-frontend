server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API, Swagger, OpenAPI, Actuator → backend
    location ~ ^/(api|swagger-ui|v3|actuator)(/.*)?$ {
        proxy_pass         http://urlshortener_app:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Short-code redirect: proxy to backend.
    # Valid codes → backend returns 302 (passed through).
    # Unknown codes → backend returns 404 → nginx falls back to SPA.
    location ~ ^/[^/]+$ {
        proxy_pass              http://urlshortener_app:8080;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_intercept_errors  on;
        error_page 404 = @spa;
    }

    # SPA fallback — serve index.html for all React Router paths
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        try_files /index.html =404;
    }
}
